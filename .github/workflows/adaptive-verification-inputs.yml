name: Adaptive layout verification inputs
on:
  push:
    branches: [work/ide-adaptive-layout]
    paths: [.github/workflows/adaptive-verification-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ui2
      - name: Package public source and pinned compiler for verification
        run: |
          curl --fail --location --retry 3 -o v.zip https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev
          tar --exclude=.git -czf ui2-source.tar.gz ui2
          tar -czf ui2-headers.tar.gz -C /usr/include GL EGL KHR X11 alsa
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-verification-inputs
          path: |
            v.zip
            ui2-source.tar.gz
            ui2-headers.tar.gz
          retention-days: 1
